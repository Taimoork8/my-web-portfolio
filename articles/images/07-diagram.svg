<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="460" fill="#ffffff"/>
  <style>
    .st { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #0f172a; font-weight: 600; }
    .sm { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <marker id="ar7" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="360" y="20" width="180" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="50" class="st" text-anchor="middle">Route 53 + ACM</text>

  <rect x="360" y="100" width="180" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="130" class="st" text-anchor="middle">ALB (HTTPS)</text>

  <rect x="180" y="180" width="180" height="60" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="270" y="205" class="st" text-anchor="middle">ECS Fargate</text>
  <text x="270" y="223" class="sm" text-anchor="middle">Gunicorn + Django</text>

  <rect x="540" y="180" width="180" height="60" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="630" y="205" class="st" text-anchor="middle">ECS task (one-off)</text>
  <text x="630" y="223" class="sm" text-anchor="middle">migrate command</text>

  <rect x="180" y="290" width="180" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="315" class="st" text-anchor="middle">RDS Postgres</text>
  <text x="270" y="333" class="sm" text-anchor="middle">Multi-AZ</text>

  <rect x="540" y="290" width="180" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="630" y="315" class="st" text-anchor="middle">S3 + CloudFront</text>
  <text x="630" y="333" class="sm" text-anchor="middle">static / media files</text>

  <rect x="360" y="380" width="180" height="50" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="410" class="st" text-anchor="middle">ElastiCache Redis</text>

  <line x1="450" y1="70" x2="450" y2="100" stroke="#0f172a" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="410" y1="150" x2="300" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="490" y1="150" x2="620" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="270" y1="240" x2="270" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="360" y1="220" x2="540" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="405" x2="270" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
