<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="460" fill="#ffffff"/>
  <style>
    .st { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #0f172a; font-weight: 600; }
    .sm { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- states -->
  <rect x="40" y="40" width="160" height="60" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="120" y="75" class="st" text-anchor="middle">Scanning</text>

  <rect x="280" y="40" width="160" height="60" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="75" class="st" text-anchor="middle">Connecting</text>

  <rect x="520" y="40" width="160" height="60" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="600" y="75" class="st" text-anchor="middle">Discover Services</text>

  <rect x="280" y="180" width="160" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="215" class="st" text-anchor="middle">Subscribe</text>
  <text x="360" y="230" class="sm" text-anchor="middle">(notify characteristic)</text>

  <rect x="520" y="180" width="160" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="215" class="st" text-anchor="middle">Stream Data</text>
  <text x="600" y="230" class="sm" text-anchor="middle">to UI / Bloc</text>

  <rect x="280" y="320" width="160" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="360" y="350" class="st" text-anchor="middle">Disconnect</text>
  <text x="360" y="365" class="sm" text-anchor="middle">/ Reconnect logic</text>

  <line x1="200" y1="70" x2="280" y2="70" stroke="#0f172a" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="440" y1="70" x2="520" y2="70" stroke="#0f172a" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="600" y1="100" x2="600" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="520" y1="210" x2="440" y2="210" stroke="#0f172a" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="360" y1="240" x2="360" y2="320" stroke="#0f172a" stroke-width="2" marker-end="url(#ar2)"/>
  <path d="M280,350 C160,350 160,70 200,70" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar2)"/>

  <text x="40" y="420" class="sm">Dashed line: on disconnect, return to scanning and retry with backoff.</text>
</svg>
