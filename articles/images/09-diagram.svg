<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="460" fill="#ffffff" rx="16"/>
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #0f172a; font-weight: 700; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #1e293b; font-weight: 600; }
    .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .arrow-text { font-family: monospace; font-size: 10px; fill: #475569; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" class="title">BLE Background Execution &amp; Queue Architecture</text>

  <!-- Component: Flutter UI Layer -->
  <rect x="40" y="100" width="180" height="260" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="130" class="label" text-anchor="middle">Flutter UI Layer</text>
  <text x="130" y="150" class="desc" text-anchor="middle">(Main Isolate)</text>
  
  <rect x="60" y="180" width="140" height="50" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="210" class="label" font-size="12" text-anchor="middle">BLoC / Riverpod</text>
  
  <rect x="60" y="270" width="140" height="50" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="300" class="label" font-size="12" text-anchor="middle">UI Widgets</text>

  <!-- Component: Background Service -->
  <rect x="360" y="100" width="200" height="260" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="460" y="130" class="label" text-anchor="middle">Background Service</text>
  <text x="460" y="150" class="desc" text-anchor="middle">(Background Isolate)</text>

  <rect x="380" y="180" width="160" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="205" class="label" font-size="12" text-anchor="middle">Command Queue</text>
  <text x="460" y="222" class="desc" text-anchor="middle">Prevents GATT collisions</text>

  <rect x="380" y="270" width="160" height="60" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>
  <text x="460" y="295" class="label" font-size="12" text-anchor="middle">Reconnection Agent</text>
  <text x="460" y="312" class="desc" text-anchor="middle">Exponential backoff</text>

  <!-- Component: Native Wrapper -->
  <rect x="680" y="100" width="180" height="260" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="770" y="130" class="label" text-anchor="middle">OS Core Bluetooth</text>
  <text x="770" y="150" class="desc" text-anchor="middle">(CoreBluetooth / Android BLE)</text>

  <rect x="700" y="180" width="140" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="770" y="210" class="label" font-size="11" text-anchor="middle">Foreground Service (Android)</text>
  
  <rect x="700" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="770" y="300" class="label" font-size="11" text-anchor="middle">CoreBluetooth Background</text>

  <!-- Connections -->
  <!-- UI <-> Background Service -->
  <path d="M220,195 L360,195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="290" y="185" class="arrow-text" text-anchor="middle">Port.send()</text>
  
  <path d="M360,225 L220,225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="243" class="arrow-text" text-anchor="middle">Port stream</text>

  <!-- Background Service <-> Native -->
  <path d="M560,210 L680,210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="200" class="arrow-text" text-anchor="middle">MethodChannel</text>

  <path d="M680,300 L560,300" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="320" class="arrow-text" text-anchor="middle">EventChannel</text>

  <!-- Footer explanation -->
  <rect x="40" y="390" width="820" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="414" class="desc" font-size="12">Flow: UI requests are dispatched to a separate Background Isolate, which coordinates sequential GATT writes via a queue. Reconnection runs in the background isolate even when UI is suspended.</text>
</svg>
