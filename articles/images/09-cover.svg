<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6F432"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg9)"/>
  
  <!-- Glowing subtle patterns -->
  <circle cx="1100" cy="315" r="280" fill="url(#glow9)" opacity="0.06" filter="blur(60px)"/>
  <circle cx="100" cy="550" r="150" fill="#3b82f6" opacity="0.04" filter="blur(40px)"/>

  <!-- Network / Background nodes -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5">
    <line x1="850" y1="200" x2="950" y2="150" />
    <line x1="950" y1="150" x2="1050" y2="250" />
    <line x1="1050" y1="250" x2="980" y2="380" />
    <line x1="980" y1="380" x2="850" y2="200" />
    <line x1="950" y1="150" x2="980" y2="380" />
    <circle cx="850" cy="200" r="6" fill="#3b82f6" stroke="none" />
    <circle cx="950" cy="150" r="6" fill="#C6F432" stroke="none" />
    <circle cx="1050" cy="250" r="6" fill="#3b82f6" stroke="none" />
    <circle cx="980" cy="380" r="6" fill="#3b82f6" stroke="none" />
  </g>

  <!-- Bluetooth / Background Service Signal Icon -->
  <g transform="translate(930, 240) scale(1.3)" stroke="#C6F432" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-60 L30,-30 L-15,10 L30,50 L0,80 L0,-60"/>
    <path d="M-30,-20 L-45,-20" stroke="#3b82f6" opacity="0.8"/>
    <path d="M-30,10 L-50,10" stroke="#3b82f6" opacity="0.8"/>
    <path d="M-30,40 L-45,40" stroke="#3b82f6" opacity="0.8"/>
    <circle cx="0" cy="10" r="110" stroke="#3b82f6" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Typography -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="54" fill="#ffffff" font-weight="900" letter-spacing="-0.02em">Flutter BLE</text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="54" fill="#C6F432" font-weight="900" letter-spacing="-0.02em">Background Services</text>
  
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" font-weight="400" width="600">
    <tspan x="80" dy="0">Reliable background data streaming, OS execution limits,</tspan>
    <tspan x="80" dy="32">command queueing, and robust reconnection logic.</tspan>
  </text>

  <!-- Footer Branding -->
  <rect x="80" y="500" width="16" height="16" rx="4" fill="#C6F432"/>
  <text x="108" y="514" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" font-weight="600">tiakha.dev</text>
</svg>
