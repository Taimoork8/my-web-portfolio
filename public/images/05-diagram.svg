<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#ffffff"/>
  <style>
    .h { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #0f172a; font-weight: 700; }
    .c { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #334155; }
  </style>
  <rect x="20" y="20" width="420" height="380" rx="12" fill="#fffbeb" stroke="#facc15" stroke-width="2"/>
  <text x="230" y="55" class="h" text-anchor="middle">Firebase</text>
  <text x="45" y="90" class="c">Data model: Firestore (NoSQL, document)</text>
  <text x="45" y="120" class="c">Pricing: per-operation (read/write/invoke)</text>
  <text x="45" y="150" class="c">Best for: mobile-first, offline sync,</text>
  <text x="45" y="170" class="c">first-party Gemini / Google Cloud</text>
  <text x="45" y="200" class="c">Auth: mature, deeply integrated</text>
  <text x="45" y="230" class="c">Realtime: mature, battle-tested SDKs</text>
  <text x="45" y="260" class="c">Vendor: Google Cloud only</text>
  <text x="45" y="300" class="c">Watch out for: cost scales with usage</text>
  <text x="45" y="320" class="c">volume, can surprise at scale</text>

  <rect x="460" y="20" width="420" height="380" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="670" y="55" class="h" text-anchor="middle">Supabase</text>
  <text x="485" y="90" class="c">Data model: Postgres (SQL, relational)</text>
  <text x="485" y="120" class="c">Pricing: resource-based (compute/storage)</text>
  <text x="485" y="150" class="c">Best for: web apps, complex queries,</text>
  <text x="485" y="170" class="c">teams that want SQL and open source</text>
  <text x="485" y="200" class="c">Auth: solid, Postgres row-level security</text>
  <text x="485" y="230" class="c">Realtime: Postgres changefeeds</text>
  <text x="485" y="260" class="c">Vendor: open source, self-hostable</text>
  <text x="485" y="300" class="c">Watch out for: mobile offline sync is</text>
  <text x="485" y="320" class="c">less mature than Firebase's</text>
</svg>
