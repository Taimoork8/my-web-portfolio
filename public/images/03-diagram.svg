<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="400" fill="#ffffff"/>
  <style>
    .st { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #0f172a; font-weight: 600; }
    .sm { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="30" y="160" width="140" height="60" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="100" y="195" class="st" text-anchor="middle">Client</text>

  <rect x="220" y="160" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="295" y="188" class="st" text-anchor="middle">URLconf</text>
  <text x="295" y="204" class="sm" text-anchor="middle">routes request</text>

  <rect x="420" y="60" width="160" height="60" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="500" y="88" class="st" text-anchor="middle">Permission</text>
  <text x="500" y="104" class="sm" text-anchor="middle">classes check</text>

  <rect x="420" y="160" width="160" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="188" class="st" text-anchor="middle">ViewSet</text>
  <text x="500" y="204" class="sm" text-anchor="middle">/ APIView</text>

  <rect x="420" y="260" width="160" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="288" class="st" text-anchor="middle">Serializer</text>
  <text x="500" y="304" class="sm" text-anchor="middle">validate / shape</text>

  <rect x="650" y="160" width="180" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="740" y="188" class="st" text-anchor="middle">QuerySet</text>
  <text x="740" y="204" class="sm" text-anchor="middle">select_related / prefetch</text>

  <line x1="170" y1="190" x2="220" y2="190" stroke="#0f172a" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="370" y1="190" x2="420" y2="190" stroke="#0f172a" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="500" y1="160" x2="500" y2="120" stroke="#0f172a" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="580" y1="190" x2="650" y2="190" stroke="#0f172a" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="500" y1="220" x2="500" y2="260" stroke="#0f172a" stroke-width="2" marker-end="url(#ar3)"/>

  <text x="30" y="370" class="sm">Request flow: Client → URLconf → Permission check → ViewSet → QuerySet (DB) → Serializer → JSON response</text>
</svg>
