<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="400" fill="#ffffff"/>
  <style>
    .st { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #0f172a; font-weight: 600; }
    .sm { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <marker id="ar8" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="70" rx="10" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
  <text x="150" y="70" class="st" text-anchor="middle">User input</text>
  <text x="150" y="88" class="sm" text-anchor="middle">(text, image, voice)</text>

  <rect x="330" y="40" width="240" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="70" class="st" text-anchor="middle">Route: on-device or cloud?</text>
  <text x="450" y="88" class="sm" text-anchor="middle">task complexity / privacy / connectivity</text>

  <rect x="640" y="0" width="220" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="35" class="st" text-anchor="middle">Gemini Nano (on-device)</text>

  <rect x="640" y="100" width="220" height="60" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="750" y="135" class="st" text-anchor="middle">Cloud LLM API (streamed)</text>

  <rect x="330" y="180" width="240" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="205" class="st" text-anchor="middle">Stream tokens to UI</text>
  <text x="450" y="223" class="sm" text-anchor="middle">incremental render, not spinner</text>

  <rect x="330" y="280" width="240" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="305" class="st" text-anchor="middle">Cache / rate-limit</text>
  <text x="450" y="323" class="sm" text-anchor="middle">protect against runaway cost</text>

  <line x1="260" y1="75" x2="330" y2="75" stroke="#0f172a" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="570" y1="60" x2="640" y2="35" stroke="#0f172a" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="570" y1="90" x2="640" y2="120" stroke="#0f172a" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="750" y1="130" x2="450" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="450" y1="240" x2="450" y2="280" stroke="#0f172a" stroke-width="2" marker-end="url(#ar8)"/>
</svg>
