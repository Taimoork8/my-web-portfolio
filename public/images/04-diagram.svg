<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="440" fill="#ffffff"/>
  <style>
    .st { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #0f172a; font-weight: 600; }
    .sm { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="360" y="20" width="180" height="55" rx="10" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
  <text x="450" y="53" class="st" text-anchor="middle">Tenant Middleware</text>

  <rect x="60" y="120" width="220" height="70" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="170" y="150" class="st" text-anchor="middle">Schema-per-tenant</text>
  <text x="170" y="168" class="sm" text-anchor="middle">(django-tenants, Postgres schemas)</text>

  <rect x="340" y="120" width="220" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="150" class="st" text-anchor="middle">Shared schema + tenant_id</text>
  <text x="450" y="168" class="sm" text-anchor="middle">(row-level filtering)</text>

  <rect x="620" y="120" width="220" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="730" y="150" class="st" text-anchor="middle">DB-per-tenant</text>
  <text x="730" y="168" class="sm" text-anchor="middle">(enterprise / compliance tier)</text>

  <rect x="360" y="250" width="180" height="55" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="283" class="st" text-anchor="middle">Billing (Stripe)</text>

  <rect x="360" y="330" width="180" height="55" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="363" class="st" text-anchor="middle">Celery + Redis</text>

  <line x1="450" y1="75" x2="450" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="145" x2="360" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="560" y1="145" x2="620" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="450" y1="190" x2="450" y2="250" stroke="#0f172a" stroke-width="2" marker-end="url(#ar4)"/>
  <line x1="450" y1="305" x2="450" y2="330" stroke="#0f172a" stroke-width="2" marker-end="url(#ar4)"/>

  <text x="60" y="420" class="sm">Middleware resolves tenant per request; isolation strategy picked based on scale and compliance needs.</text>
</svg>
